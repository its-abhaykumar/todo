<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>To Do</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }
        
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #2dd4bf, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: #eafffb;
            width: 320px;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        h2 {
            margin: 0;
            font-weight: 600;
        }
        
        p {
            margin: 6px 0 16px;
            color: #555;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            gap: 8px;
        }
        
        input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background: #2563eb;
        }
        
        .section {
            margin-top: 18px;
        }
        
        .section-title {
            font-size: 12px;
            color: #2563eb;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        li {
            background: white;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        li.completed {
            text-decoration: line-through;
            color: #999;
        }
        
        .actions button {
            background: none;
            color: #ef4444;
            font-size: 16px;
        }
        
        footer {
            text-align: center;
            font-size: 10px;
            margin-top: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Tasks</h2>
        <p>What’s the plan for today?</p>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="New task..." />
            <button onclick="addTask()">Add</button>
        </div>

        <div class="section">
            <div class="section-title">TO DO</div>
            <ul id="todoList"></ul>
        </div>

        <div class="section">
            <div class="section-title">COMPLETED</div>
            <ul id="completedList"></ul>
        </div>

        <footer>
            Built with ❤️
        </footer>
    </div>

    <script>
        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();

            if (!text) return;

            const li = document.createElement("li");
            li.innerHTML = `
        <span>${text}</span>
        <div class="actions">
          <button onclick="completeTask(this)">✔</button>
        </div>
      `;

            document.getElementById("todoList").appendChild(li);
            input.value = "";
        }

        function completeTask(button) {
            const li = button.parentElement.parentElement;
            li.classList.add("completed");
            li.querySelector(".actions").innerHTML = `
        <button onclick="removeTask(this)">✖</button>
      `;
            document.getElementById("completedList").appendChild(li);
        }

        function removeTask(button) {
            const li = button.parentElement.parentElement;
            li.remove();
        }
    </script>

</body>

</html>
